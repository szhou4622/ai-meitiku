name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feigua-tests:
    name: feigua-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test Feigua contracts, task lifecycle and feature registration
        run: node --test tests/feigua-audit-fixes.test.mjs tests/feigua-product-cache.test.mjs tests/feigua-music-schedule.test.mjs tests/feigua-topic-schedule.test.mjs tests/feigua-video-details.test.mjs tests/feigua-retry.test.mjs tests/feigua-login-credentials.test.mjs tests/feigua-login-entry.test.mjs tests/feigua-trends.test.mjs tests/feigua-api.test.mjs tests/feature-registry.test.mjs tests/electron-runtime-imports.test.mjs

  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository files
        run: python3 scripts/check_repository.py
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
